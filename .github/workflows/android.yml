name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build-test-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: kotlin-chess-debug-apk
          path: app/build/outputs/apk/debug/
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            # Wait for the system to be fully ready
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              echo "Waiting for emulator boot..."
              sleep 2
            done
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.example.chessmobile 1
            adb shell pidof com.example.chessmobile
